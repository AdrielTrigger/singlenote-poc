<html>
    <head>
        <meta charset="UTF-8"/>
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <meta
            http-equiv="X-Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
        />
        <title>Single note editor</title>
    </head>
    <body>
        <h1>Single note editor</h1>
        <form id="save-note-form">
            <input type="text" id="note-box" placeholder="Write your note here...">
            <button type="submit">SAVE NOTE</button>
        </form>
        <p id="note-text"></p>
        <button id="edit-note-button">EDIT NOTE</button>
        <button id="delete-note-button">DELETE NOTE</button>
    </body>
    <script src="note-logic.js"></script>
</html>
